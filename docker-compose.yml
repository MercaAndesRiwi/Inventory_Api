services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POS_DB_NAME}
      POSTGRES_USER: ${POS_DB_USER}
      POSTGRES_PASSWORD: ${POS_DB_PASSWORD}
    ports:
      - "5432:$POS_DB_PORT"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - POS_DB_HOST=db
    depends_on:
      - db

volumes:
  postgres_data:

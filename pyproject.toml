[project]
name = "api-inventory"
version = "0.1.0"
description = "Deterministic inventory API and seller catalog (F3) for MercadAndes"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inventory"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "httpx",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
